<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b57d0"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css?v=16"><title>大会ナンバー受付</title></head>
<body><main class="wrap"><header><div id="event" class="eventTitle">大会名未設定</div><div id="point">地点未設定</div><div id="staff">担当：未設定</div><div id="destination" class="destination">保存先：標準スプレッドシート</div><div class="topLine"><div id="countdown">TOP予想：未設定</div><div id="eventDate" class="eventDate"></div></div><button id="manModeBtn" class="manModeTop" type="button">🔢 万台番号モード：OFF</button><div id="manModeHint" class="hint manModeTopHint">通常：1～99999。万台は「イチ・ゼロ・ゼロ・ゼロ・ヨン」のように数字を1桁ずつ読むと安全です。</div></header>
<section class="panel"><div class="modeStatusRow"><div id="modeBadge" class="badge">マラソン</div><div id="status" class="status">停止中</div></div><button id="voiceBtn" class="voice" type="button">🎤 音声受付開始</button><div class="hint">音声は1件ずつ自動登録し、登録後すぐ次を聞きます。</div>
<div class="manual"><label for="numberInput">🔢 直接入力</label><input id="numberInput" inputmode="numeric" autocomplete="off" placeholder="例：1250 / 125-3"><div class="registerMuriRow"><button id="registerBtn" class="register" type="button">登録</button><button id="muriBtn" class="muri" type="button">ムリ（1人カウント）</button></div></div>
<div class="deleteBlock"><label for="deleteNumberInput">🗑 番号を指定して削除</label><div class="deleteRow"><input id="deleteNumberInput" inputmode="numeric" autocomplete="off" placeholder="削除する番号"><button id="deleteNumberBtn" type="button">削除</button></div><div class="hint">同じ番号が複数ある場合は、最も新しい登録1件をアプリとスプレッドシートから削除します。</div></div>
<button id="cancelLastBtn" type="button" class="cancelLast">↩ 直前をキャンセル</button></section>
<section class="stats"><div><b id="okCount">0</b><span>番号登録</span></div><div><b id="muriCount">0</b><span>ムリ</span></div><div><b id="totalCount">0</b><span>総人数</span></div></section><section class="latest"><div class="latestHead"><div class="caption">最新</div><div id="rawSpeech" class="rawSpeech">音声認識候補：—</div></div><div id="latest">—</div><div id="latestSub"></div></section><section class="history"><div class="caption">直近10件</div><div id="history"></div></section>
<section class="settings"><button id="settingsBtn" type="button">⚙ 大会・地点設定</button><button id="installBtn" type="button" hidden>📱 ホーム画面に追加</button></section>
<div id="settingsPanel" class="modal" hidden><div class="dialog"><h2>大会・地点設定</h2><label>大会名<input id="sEvent"></label><label>開催日<input id="sDate" type="date"></label><label>方式<select id="sMode"><option value="MARATHON">マラソン</option><option value="EKIDEN">駅伝</option><option value="RELAY">リレーマラソン</option></select></label><label>地点名<input id="sPoint" placeholder="フィニッシュ / 第1中継所 / 5km など"></label><label>担当者名<input id="sStaff"></label><label>TOP予想時刻<input id="sTop" placeholder="09:30:00"></label><label id="relayGapWrap" hidden>周回差（再読み取り無効時間・1～60分）<input id="sRelayGap" type="number" min="1" max="60" step="1" value="1"></label><label>保存先スプレッドシートID<input id="sSheetId" autocomplete="off" placeholder="URLの /d/ と /edit の間"></label><label>Google Apps Script URL<input id="sEndpoint" autocomplete="off" placeholder="https://script.google.com/macros/s/.../exec"></label><button type="button" id="testConnectionBtn" style="width:100%;margin-top:8px;padding:11px;border:1px solid #0b57d0;border-radius:10px;background:#fff;color:#0b57d0;font-weight:700;cursor:pointer;">🔗 保存先を接続確認</button><div id="connectionStatus" class="hint" style="margin-top:6px;"></div><div class="dialogBtns"><button type="button" id="saveSettings" onclick="window.saveSettingsFallback()">保存</button><button type="button" id="closeSettings" onclick="document.getElementById('settingsPanel').hidden=true">閉じる</button></div><button type="button" id="clearRecordsBtn" style="width:100%;margin-top:14px;padding:12px;border:1px solid #c62828;border-radius:10px;background:#fff;color:#c62828;font-weight:700;cursor:pointer;">🗑 登録データを全消去</button><p class="small">保存先IDを変えるだけで大会ごとのスプレッドシートへ切り替えられます。</p></div></div></main>
<script src="app/app.js?v=16"></script><script>
window.saveSettingsFallback=function(){try{let m=document.getElementById('sMode').value,g=Math.max(1,Math.min(60,Number(document.getElementById('sRelayGap').value)||1));let old={};try{old=JSON.parse(localStorage.getItem('taikai_voice_cfg_v1')||'{}')}catch{}const c={event:document.getElementById('sEvent').value||'大会名未設定',date:document.getElementById('sDate').value,mode:m,point:document.getElementById('sPoint').value||'地点未設定',staff:document.getElementById('sStaff').value,top:document.getElementById('sTop').value,relayGap:g,endpoint:document.getElementById('sEndpoint').value.trim(),sheetId:document.getElementById('sSheetId').value.trim(),sheetName:old.sheetName||''};localStorage.setItem('taikai_voice_cfg_v1',JSON.stringify(c));location.reload()}catch(e){alert('設定を保存できませんでした：'+e.message);}};
(function(){
  const btn=document.getElementById('deleteNumberBtn');
  const input=document.getElementById('deleteNumberInput');
  if(!btn||typeof window.deleteNumber!=='function')return;
  const originalDeleteNumber=window.deleteNumber;
  btn.removeEventListener('click',originalDeleteNumber);
  async function deleteAndSync(){
    const activeIds=new Set();
    try{(records||[]).forEach(r=>{if(r&&!r.cancelled)activeIds.add(r.id);});}catch{}
    originalDeleteNumber();
    let deleted=null;
    try{deleted=(records||[]).find(r=>r&&r.cancelled&&r.cancelledBy==='番号指定削除'&&activeIds.has(r.id));}catch{}
    if(!deleted)return;
    if(!cfg.endpoint){document.getElementById('status').textContent='アプリから削除しました。Google Apps Script URLが未設定のためスプレッドシートは未削除です。';return;}
    if(!navigator.onLine){document.getElementById('status').textContent='アプリから削除しました。オフラインのためスプレッドシートは未削除です。';return;}
    document.getElementById('status').textContent=`「${deleted.value}」をスプレッドシートから削除しています…`;
    try{
      await fetch(cfg.endpoint,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'DELETE',id:deleted.id||'',point:deleted.point||cfg.point||'',value:deleted.value||'',mode:deleted.mode||cfg.mode||'',event:deleted.event||cfg.event||'',date:deleted.date||cfg.date||'',staff:deleted.staff||cfg.staff||'',lap:deleted.lap||'',time:deleted.time||'',sheetId:deleted.sheetId||cfg.sheetId||''})});
      document.getElementById('status').textContent=`「${deleted.value}」の削除命令をスプレッドシートへ送信しました`;
    }catch(e){document.getElementById('status').textContent='アプリからは削除しましたが、スプレッドシートへの削除送信に失敗しました。通信状態を確認してください。';}
  }
  btn.addEventListener('click',deleteAndSync);
  if(input){input.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();e.stopImmediatePropagation();deleteAndSync();}},true);}
})();
</script></body></html>
