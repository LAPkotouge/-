<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b57d0"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css?v=17"><title>大会ナンバー受付</title></head>
<body><main class="wrap">
<header class="appHeader"><div class="titleRow"><div id="event" class="eventTitle">大会名未設定</div><div id="eventDate" class="eventDate"></div></div><div class="infoBox"><div class="infoRow"><span id="staff">担当：未設定</span><span class="dotSep">・</span><span id="point">地点未設定</span><span class="dotSep">・</span><span id="connectionState" class="connected">● 接続中</span><span class="dotSep">・</span><span id="status" class="status">停止中</span></div><div id="destination" class="destination">保存先：標準スプレッドシート</div></div></header>
<section class="panel mainPanel"><div class="timeBar"><div class="timeItem"><span>現在時刻</span><b id="currentTime">--:--:--</b></div><div class="timeDivider"></div><div class="timeItem"><span>TOPまでの時間</span><b id="countdown">未設定</b></div></div>
<button id="voiceBtn" class="voice" type="button">🎤 音声受付開始</button><div class="hint voiceHint">音声は1件ずつ自動登録し、登録後すぐ次を聞きます。</div>
<div class="manual"><label for="numberInput">直接入力</label><div class="inputModeRow"><input id="numberInput" inputmode="numeric" autocomplete="off" placeholder="例：1234 / 101-1"><button id="manModeBtn" class="manModeBtn" type="button"><span>万台</span><span>モード</span></button></div><div id="manModeHint" class="hint manModeHint">通常：1～99999。万台は数字を1桁ずつ読むと安全です。</div><div class="registerMuriRow"><button id="registerBtn" class="register" type="button">登録</button><button id="muriBtn" class="muri" type="button">ムリ（1人カウント）</button></div></div>
<div class="deleteBlock"><label for="deleteNumberInput">番号を指定して削除</label><div class="deleteRow"><input id="deleteNumberInput" inputmode="numeric" autocomplete="off" placeholder="削除する番号"><button id="deleteNumberBtn" type="button">削除</button></div><div class="hint">同じ番号が複数ある場合は、最も新しい登録1件をアプリとスプレッドシートから削除します。</div></div>
<div class="latestCompact"><div class="latestCell"><span>最新：</span><b id="latest">—</b><span id="latestSub"></span></div><div id="rawSpeech" class="latestCell rawSpeech">音声認識候補：—</div></div>
<button id="cancelLastBtn" type="button" class="cancelLast">↩ 直前をキャンセル</button></section>
<section class="history"><div class="historyTitle">読み上げた番号履歴 <span>（直近6件）</span></div><div class="historyHeader"><span>No.</span><span>ナンバー</span><span>時間</span></div><div id="history"></div></section>
<section class="stats"><div><b id="okCount">0</b><span>番号登録</span></div><div><b id="muriCount">0</b><span>ムリ</span></div><div><b id="totalCount">0</b><span>総人数</span></div></section>
<section class="settings"><button id="settingsBtn" type="button">⚙ 大会・地点設定</button><button id="installBtn" type="button" hidden>📱 ホーム画面に追加</button></section>
<div id="modeBadge" hidden>マラソン</div>
<div id="settingsPanel" class="modal" hidden><div class="dialog"><h2>大会・地点設定</h2><label>大会名<input id="sEvent"></label><label>開催日<input id="sDate" type="date"></label><label>方式<select id="sMode"><option value="MARATHON">マラソン</option><option value="EKIDEN">駅伝</option><option value="RELAY">リレーマラソン</option></select></label><label>地点名<input id="sPoint" placeholder="フィニッシュ / 第1中継所 / 5km など"></label><label>担当者名<input id="sStaff"></label><label>TOP予想時刻<input id="sTop" placeholder="09:30:00"></label><label id="relayGapWrap" hidden>周回差（再読み取り無効時間・1～60分）<input id="sRelayGap" type="number" min="1" max="60" step="1" value="1"></label><label>保存先スプレッドシートID<input id="sSheetId" autocomplete="off" placeholder="URLの /d/ と /edit の間"></label><label>Google Apps Script URL<input id="sEndpoint" autocomplete="off" placeholder="https://script.google.com/macros/s/.../exec"></label><button type="button" id="testConnectionBtn" class="testBtn">🔗 保存先を接続確認</button><div id="connectionStatus" class="hint"></div><div class="dialogBtns"><button type="button" id="saveSettings" onclick="window.saveSettingsFallback()">保存</button><button type="button" id="closeSettings" onclick="document.getElementById('settingsPanel').hidden=true">閉じる</button></div><button type="button" id="clearRecordsBtn" class="clearBtn">🗑 登録データを全消去</button><p class="small">保存先IDを変えるだけで大会ごとのスプレッドシートへ切り替えられます。</p></div></div></main>
<script src="app/app.js?v=16"></script><script>
window.saveSettingsFallback=function(){try{let m=document.getElementById('sMode').value,g=Math.max(1,Math.min(60,Number(document.getElementById('sRelayGap').value)||1));let old={};try{old=JSON.parse(localStorage.getItem('taikai_voice_cfg_v1')||'{}')}catch{}const c={event:document.getElementById('sEvent').value||'大会名未設定',date:document.getElementById('sDate').value,mode:m,point:document.getElementById('sPoint').value||'地点未設定',staff:document.getElementById('sStaff').value,top:document.getElementById('sTop').value,relayGap:g,endpoint:document.getElementById('sEndpoint').value.trim(),sheetId:document.getElementById('sSheetId').value.trim(),sheetName:old.sheetName||''};localStorage.setItem('taikai_voice_cfg_v1',JSON.stringify(c));location.reload()}catch(e){alert('設定を保存できませんでした：'+e.message);}};
(function(){const btn=document.getElementById('deleteNumberBtn');const input=document.getElementById('deleteNumberInput');if(btn&&typeof window.deleteNumber==='function'){const originalDeleteNumber=window.deleteNumber;btn.removeEventListener('click',originalDeleteNumber);async function deleteAndSync(){const activeIds=new Set();try{(records||[]).forEach(r=>{if(r&&!r.cancelled)activeIds.add(r.id);});}catch{}originalDeleteNumber();let deleted=null;try{deleted=(records||[]).find(r=>r&&r.cancelled&&r.cancelledBy==='番号指定削除'&&activeIds.has(r.id));}catch{}if(!deleted)return;if(!cfg.endpoint){document.getElementById('status').textContent='アプリから削除済・保存先未設定';return;}if(!navigator.onLine){document.getElementById('status').textContent='アプリから削除済・オフライン';return;}try{await fetch(cfg.endpoint,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'DELETE',id:deleted.id||'',point:deleted.point||cfg.point||'',value:deleted.value||'',mode:deleted.mode||cfg.mode||'',event:deleted.event||cfg.event||'',date:deleted.date||cfg.date||'',staff:deleted.staff||cfg.staff||'',lap:deleted.lap||'',time:deleted.time||'',sheetId:deleted.sheetId||cfg.sheetId||''})});document.getElementById('status').textContent='削除送信完了';}catch(e){document.getElementById('status').textContent='削除送信失敗';}}btn.addEventListener('click',deleteAndSync);if(input)input.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();e.stopImmediatePropagation();deleteAndSync();}},true);}}
function fmtDate(s){if(!s)return '';const p=s.split('-');return p.length===3?`${Number(p[0])}年${Number(p[1])}月${Number(p[2])}日`:s;}
function topRemain(){if(!cfg.top)return '未設定';const p=cfg.top.split(':').map(Number);if(p.length<2)return '未設定';const n=new Date(),t=new Date();t.setHours(p[0],p[1],p[2]||0,0);let sec=Math.floor((t-n)/1000),sign=sec<0?'+':'-';sec=Math.abs(sec);return sign+String(Math.floor(sec/3600)).padStart(2,'0')+':'+String(Math.floor(sec%3600/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');}
function renderHistoryV17(){const h=document.getElementById('history');if(!h)return;const active=(records||[]).filter(r=>!r.cancelled).slice(0,6);h.innerHTML=active.map((r,i)=>{const relay=r.mode==='RELAY'&&r.lap?` <small>${r.lap}周目</small>`:'';const dup=r.duplicate&&r.mode!=='RELAY'?` <span style="color:#d32f2f;font-size:12px;font-weight:900;white-space:nowrap;">重複</span>`:'';const invalid=r.invalidGap?` <span style="color:#b3261e;font-size:11px;font-weight:900;white-space:nowrap;">無効</span>`:'';return `<div class="row"><span>${i+1}</span><span>${esc(r.value)}${relay}${dup}${invalid}</span><span>${esc(r.time)}</span></div>`;}).join('');}
const baseRender=window.render;if(typeof baseRender==='function'){window.render=function(){baseRender();renderHistoryV17();};}
function refreshLayout(){const n=new Date();document.getElementById('currentTime').textContent=n.toLocaleTimeString('ja-JP',{hour12:false});document.getElementById('countdown').textContent=topRemain();document.getElementById('eventDate').textContent=fmtDate(cfg.date);document.getElementById('point').textContent=cfg.point||'地点未設定';document.getElementById('connectionState').textContent=navigator.onLine?'● 接続中':'● オフライン';document.getElementById('connectionState').className=navigator.onLine?'connected':'offline';renderHistoryV17();}
setInterval(refreshLayout,500);setTimeout(refreshLayout,50);
})();
</script></body></html>
